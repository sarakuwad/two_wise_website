<!DOCTYPE html>

<head>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
          colors: {
            dark: {
              base: '#0A0E0C',
              surface: '#111714',
              card: '#161E1A',
              cardHover: '#1B2621',
              border: 'rgba(255, 255, 255, 0.08)',
            },
            pastel: {
              green: '#86EFAC',       // Pastel Mint / Emerald
              greenLight: '#D1FAE5',  // Soft pastel mint tint
              greenDark: '#059669',   // Darker emerald
              red: '#FDA4AF',         // Pastel Crimson / Rose
              redLight: '#FFE4E6',    // Soft pastel rose tint
              redDark: '#E11D48',     // Darker rose/crimson
              cream: '#F4F5F0',       // Luxury off-white

            }
          },
          borderRadius: {
            '2xl': '1rem',
            '3xl': '1.5rem',
            '4xl': '2rem',
          },
          boxShadow: {
            'soft': '0 10px 30px -10px rgba(0, 0, 0, 0.5)',
            'soft-lg': '0 20px 40px -15px rgba(0, 0, 0, 0.7)',
            'glow-green': '0 0 35px -5px rgba(134, 239, 172, 0.2)',

            'rich-card': '0 10px 40px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06)',

  <!-- React 18 and ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- Official Favicon -->
  <link rel="icon" type="image/png" href="./favicon.png" />

    <div class="min-h-screen flex items-center justify-center bg-[#0A0E0C]">
      <div class="text-center space-y-4">
        <div class="w-16 h-16 mx-auto rounded-3xl bg-[#111714] border border-emerald-500/20 flex items-center justify-center shadow-glow-green">

        <p class="text-xs text-emerald-300/60">Learn Smart. Think Wise.</p>
